<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DarrenMemorial — Milk Run Scheduler</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Milk Run Scheduler</h1><p>Local-only scheduling. Nothing is uploaded.</p></header><main><section class="card"><h2>Paste Dump data</h2><textarea id="dumpInput" rows="12" placeholder="Paste the full Dump table"></textarea><div class="actions"><button id="generateBtn" class="primary">Generate Milk Run</button><button id="clearDumpBtn">Clear Dump</button><button id="exportCsvBtn" disabled>Download CSV</button></div><div id="dumpStatus" role="status"></div></section><section class="card"><h2>Configuration</h2><label>Legacy van days <select id="vanDaysMode"><option value="2">Tuesday/Thursday</option><option value="3">Monday/Wednesday/Friday</option></select></label><div class="config-controls"><button id="addVenueBtn">Add venue</button><button id="exportConfigBtn">Export config JSON</button><label class="file-label">Import config JSON<input type="file" id="importConfigInput" accept=".json,application/json"></label><button id="resetConfigBtn">Reset config</button></div><div class="table-wrap"><table id="venueTable"><thead><tr><th>Venue</th><th>Contact</th><th>Type</th><th>Stops/day</th><th>Truck AM</th><th>Truck PM</th><th>Van order</th><th></th></tr></thead><tbody id="venueRows"></tbody></table></div></section><section class="card"><h2>Generated schedule</h2><div id="scheduleOutput"></div></section></main><script src="config.js"></script><script src="dump.js"></script><script src="schedule.js"></script><script src="van.js"></script><script src="render.js"></script><script src="ui.js"></script><script src="features.js"></script><script>window.renderConfig();</script><script src="project.js"></script></body></html>
